# Reference copy of the prod-dist repo's upload workflow
# (.github/workflows/upload-to-appstore.yml in that repo — keep the two in
# sync; this copy lives here so the wedding repo tracks the full upload
# pipeline next to DEPLOYMENT.md and the App Review docs).
#
# Round-2 App Review hardening (see docs/APP_REVIEW_2026-07-ROUND2.md):
#   - The provisioning profile is now read from a COMMITTED file at the
#     prod-dist repo root (./embedded.mobileprovision), not from the
#     IOS_PROVISIONING_PROFILE_BASE64 secret. A profile contains no private
#     key — it ships inside every distributed IPA — so it is not secret
#     material, and an opaque secret is exactly how a stale profile (the old
#     Apple Pay/Wallet-entitled SMWedding_AppStore_Profile) can silently keep
#     shipping: nobody can diff a secret. Commit the CLEAN profile
#     (SMWedding_AppStore_Profile_2) and rotation becomes a reviewable diff.
#     The .p12 identity, its password, and the ASC API key stay secrets —
#     those ARE private key material.
#   - "Guard: provisioning profile" hard-fails on Apple Pay/Wallet
#     entitlements BEFORE any signing (guideline 2.1 PassKit rejection).
#   - Post-sign checks fail on PassKit linkage / payment entitlements in the
#     SIGNED app, and assert the 2.3.8 display name.
#   - CFBundleVersion leads with BUILD_NUMBER_BASE + run_number so CI builds
#     always outrank the manually-uploaded 11.*/12.*/13.* stamps (ASC dedup +
#     the in-app update prompt both compare component-wise numerically).
#   - Soft pre-flight warns when the App Review demo access code is not live
#     (guideline 2.1(a): the login screen's access box is server-gated).

name: Upload iOS App to App Store Connect

on:
  push:
    branches:
      - main  # Triggers the upload whenever code pushes to main
  workflow_dispatch: # Allows you to manually trigger this via the GitHub Actions tab

jobs:
  upload:
    runs-on: macos-latest # Mac runner: required for codesign + Apple upload tools

    env:
      # The committed binary is ad-hoc signed (built on Linux/WSL), so it has no
      # real Apple certificate. We re-sign it here with the Distribution identity
      # before uploading — otherwise App Store Connect rejects it with error 90034.
      SIGNING_IDENTITY: "Apple Distribution: SEONGWOO HONG (SPQDMJ2T53)"
      UNSIGNED_IPA: "./mobile.ipa"
      SIGNED_IPA: "./mobile-dist.ipa"
      # App Store provisioning profile, committed at the repo root (see header
      # note — deliberately NOT a secret so it can be inspected and diffed).
      PROFILE: "./embedded.mobileprovision"
      # Leading CFBundleVersion component = BUILD_NUMBER_BASE + run_number.
      # Manual (non-CI) uploads used 11.*, 12.*, and 13.* — the base keeps every
      # CI build strictly above them even though this workflow's run_number
      # starts at 1. Never lower this; raise it if a manual upload ever goes
      # past it.
      BUILD_NUMBER_BASE: "20"

    steps:
      # 1. Check out your code repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1a. GUARD (guideline 2.1 — PassKit): refuse to sign with a profile
      #     carrying Apple Pay / Wallet entitlements. codesign inherits the
      #     profile's entitlements into the app signature, and Apple's static
      #     analysis reads those entitlements as "the binary includes PassKit"
      #     — that is how One Seoul 1.0.0 was rejected TWICE while the Mach-O
      #     never linked PassKit. Runs before anything else so a wrong profile
      #     fails in seconds, and prints the profile identity so the run log
      #     shows exactly what was shipped.
      - name: Guard - provisioning profile is the clean App Store profile
        run: |
          set -euo pipefail
          test -f "$PROFILE" || { echo "::error::$PROFILE not found — commit the App Store profile at the repo root."; exit 1; }
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile-guard.plist"
          PB=/usr/libexec/PlistBuddy
          echo "Profile name:    $($PB -c 'Print :Name' "$RUNNER_TEMP/profile-guard.plist")"
          echo "Profile UUID:    $($PB -c 'Print :UUID' "$RUNNER_TEMP/profile-guard.plist")"
          echo "Profile expires: $($PB -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile-guard.plist")"
          echo "App ID:          $($PB -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile-guard.plist")"
          for banned in com.apple.developer.in-app-payments com.apple.developer.pass-type-identifiers; do
            if grep -q "$banned" "$RUNNER_TEMP/profile-guard.plist"; then
              echo "::error title=Apple Pay entitlement in profile::$PROFILE carries '$banned'. This reproduces the guideline 2.1 PassKit rejection. Disable Apple Pay + Wallet on the App ID, regenerate the App Store profile, and commit the clean one."
              exit 1
            fi
          done
          echo "OK: no Apple Pay / Wallet entitlements."

      # 1b. Soft pre-flight (guideline 2.1(a) — demo access): the App Review
      #     access-code box on the login screen only renders while the backend
      #     REVIEW_CODE secret is set. An upload with the demo offline is fine
      #     (you may set the code later), but SUBMITTING for review without it
      #     re-triggers the "unable to access the app" rejection — so warn
      #     loudly, don't fail.
      - name: Pre-flight - App Review demo access live? (warning only)
        run: |
          BODY="$(curl -fsS --max-time 10 https://wedding.at.day/api/auth/review || echo unreachable)"
          echo "GET /api/auth/review -> $BODY"
          case "$BODY" in
            *'"available":true'*) echo "Demo access is live." ;;
            *) echo "::warning title=App Review demo access is NOT live::Set the REVIEW_CODE secret (wrangler secret put REVIEW_CODE) and fill the ASC demo username/password BEFORE submitting this build for review — see APP_REVIEW_2026-07-ROUND2.md." ;;
          esac

      # 1c. Select the newest installed Xcode and report the iOS SDK. The app is
      #     built against the iOS 26 SDK, so the runner needs a matching Xcode.
      #     If the SDK printed here is older than the app's target, switch
      #     `runs-on` above to a macOS image that ships Xcode 26 (e.g. macos-26).
      - name: Select latest Xcode and show iOS SDK
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          LATEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          echo "Selected Xcode:"; xcodebuild -version
          echo "Available iOS SDKs:"; xcodebuild -showsdks | grep -i iphoneos || true
          echo "iphoneos SDK version: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK build:   $(xcrun --sdk iphoneos --show-sdk-build-version)"

      # 2. Import the Distribution certificate (.p12) into a temporary keychain
      #    so codesign can find the signing identity.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"

          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          # Import cert+key; allow codesign/security to use it without a UI prompt.
          security import "$CERT_PATH" -P "$P12_PASSWORD" -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          # Put our keychain first in the search list so codesign resolves the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # 3. Embed the App Store provisioning profile and re-sign the .app, then repackage.
      - name: Re-sign IPA with Distribution identity
        env:
          # Pieces of the build number. run_number (most significant, plus the
          # BUILD_NUMBER_BASE offset) increases on every run; run_attempt covers
          # manual "Re-run" of the same run. The date is filled in on the runner.
          # CFBundleVersion compares numerically, component-wise, and the offset
          # run_number leads, so it's always strictly increasing AND above every
          # manually-stamped upload (11.*/12.*/13.*). The in-app update prompt
          # (AppUpdateStore.isNewer) relies on that same component-wise
          # comparison, so a CI build numbered below a shipped build would make
          # the update prompt lie.
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/resign"

          rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q "$UNSIGNED_IPA" -d "$WORK"
          APP="$(ls -d "$WORK"/Payload/*.app)"
          echo "App bundle: $APP"

          # 3a. Inject the build-provenance keys Apple requires. A Linux/WSL build
          #     omits these (they're normally written by Xcode), which triggers
          #     "Missing Info.plist value 'DTPlatformName'" and "Unsupported SDK".
          #     Values are read from the real SDK installed on this runner, so they
          #     always reference a supported Xcode. Must run BEFORE codesign.
          INFO="$APP/Info.plist"
          PB=/usr/libexec/PlistBuddy
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_BUILD="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          PLAT_VER_PLIST="$(xcode-select -p)/Platforms/iPhoneOS.platform/version.plist"
          PLATFORM_BUILD="$($PB -c 'Print :ProductBuildVersion' "$PLAT_VER_PLIST" 2>/dev/null || echo "$SDK_BUILD")"
          XVER="$(xcodebuild -version | awk 'NR==1{print $2}')"
          XBUILD="$(xcodebuild -version | awk 'NR==2{print $3}')"
          DTXCODE="$(echo "$XVER" | awk -F. '{printf "%02d%d%d", $1, $2, ($3==""?0:$3)}')"
          OSBUILD="$(sw_vers --buildVersion)"

          set_key()  { $PB -c "Add :$1 string $2" "$INFO" 2>/dev/null || $PB -c "Set :$1 $2" "$INFO"; }
          set_bool() { $PB -c "Add :$1 bool $2"   "$INFO" 2>/dev/null || $PB -c "Set :$1 $2" "$INFO"; }
          set_key DTPlatformName      "iphoneos"
          set_key DTPlatformVersion   "$SDK_VER"
          set_key DTPlatformBuild     "$PLATFORM_BUILD"
          set_key DTSDKName           "iphoneos$SDK_VER"
          set_key DTSDKBuild          "$SDK_BUILD"
          set_key DTXcode             "$DTXCODE"
          set_key DTXcodeBuild        "$XBUILD"
          set_key DTCompiler          "com.apple.compilers.llvm.clang.1_0"
          set_key BuildMachineOSBuild "$OSBUILD"

          # Export-compliance: declare the app uses no non-exempt encryption (only
          # standard, exempt stuff like HTTPS/TLS). This pre-answers the encryption
          # question so the build isn't held in App Store Connect after processing.
          # If the app implements its OWN/proprietary crypto, set this to true and
          # complete the compliance documentation instead.
          set_bool ITSAppUsesNonExemptEncryption false

          # Guard (guideline 2.3.8): the on-device name must match the
          # marketplace name "One Seoul" — a stale mobile.ipa copied from before
          # the round-1 rename would silently reintroduce that rejection.
          DISPLAY_NAME="$($PB -c 'Print :CFBundleDisplayName' "$INFO" 2>/dev/null || echo MISSING)"
          if [ "$DISPLAY_NAME" != "One Seoul" ]; then
            echo "::error title=Display name mismatch::CFBundleDisplayName is '$DISPLAY_NAME', expected 'One Seoul' (guideline 2.3.8). The committed mobile.ipa is stale — rebuild it from the wedding repo."
            exit 1
          fi

          # Build number (CFBundleVersion): must be unique and higher than every
          # previously uploaded build. Injected from CI so you never bump it by hand.
          # Format: <base+run_number>.<YYYYMMDD>.<run_attempt>  e.g. 21.20260703.1
          # CFBundleShortVersionString (the 1.0.0 marketing version) is left as-is.
          BUILD_NUMBER="$((BUILD_NUMBER_BASE + RUN_NUMBER)).$(date +%Y%m%d).${RUN_ATTEMPT}"
          set_key CFBundleVersion "$BUILD_NUMBER"
          echo "CFBundleVersion (build)   = $($PB -c 'Print :CFBundleVersion' "$INFO")"
          echo "CFBundleShortVersionString = $($PB -c 'Print :CFBundleShortVersionString' "$INFO")"

          echo "--- injected Info.plist build keys ---"
          for k in DTPlatformName DTPlatformVersion DTPlatformBuild DTSDKName DTSDKBuild \
                   DTXcode DTXcodeBuild DTCompiler BuildMachineOSBuild ITSAppUsesNonExemptEncryption; do
            printf '  %s = %s\n' "$k" "$($PB -c "Print :$k" "$INFO")"
          done

          # 3b. Compile a real app-icon asset catalog with actool. A Linux build
          #     ships no Assets.car, so Apple rejects the bundle for missing
          #     120x120 / 152x152 icons and a missing CFBundleIconName. We build a
          #     single-size (1024, opaque) AppIcon set and let actool render every
          #     required size and emit the matching Info.plist keys. Before codesign.
          ICON_SRC="$GITHUB_WORKSPACE/appicon-1024.png"
          ASSETS="$WORK/AppIcon.xcassets"
          ICONSET="$ASSETS/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          cp "$ICON_SRC" "$ICONSET/icon-1024.png"
          printf '%s\n' '{ "images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}], "info":{"author":"xcode","version":1} }' > "$ICONSET/Contents.json"
          printf '%s\n' '{ "info":{"author":"xcode","version":1} }' > "$ASSETS/Contents.json"

          # min-deployment-target 15.0 only governs which icon variants actool
          # synthesizes (it guarantees the classic 120/152 set Apple validates);
          # the app's real deployment target stays MinimumOSVersion in Info.plist.
          xcrun actool \
            --compile "$APP" \
            --app-icon AppIcon \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --target-device iphone --target-device ipad \
            --output-partial-info-plist "$WORK/icon-partial.plist" \
            --errors --warnings --notices \
            "$ASSETS"

          echo "--- actool partial Info.plist ---"; cat "$WORK/icon-partial.plist"
          # Merge actool's icon keys (CFBundleIcons, CFBundleIconName) into Info.plist,
          # drop the legacy single-file key, and overwrite the stray alpha icon.
          $PB -c "Merge $WORK/icon-partial.plist" "$INFO"
          $PB -c "Delete :CFBundleIconFile" "$INFO" 2>/dev/null || true
          cp "$ICON_SRC" "$APP/icon-1024.png"
          echo "CFBundleIconName = $($PB -c 'Print :CFBundleIconName' "$INFO" 2>/dev/null || echo MISSING)"
          echo "Assets.car present: $([ -f "$APP/Assets.car" ] && echo yes || echo NO)"

          # 3c. Embed the provisioning profile (App Store builds require this).
          #     $PROFILE is the committed, guard-checked file from step 1a.
          cp "$PROFILE" "$APP/embedded.mobileprovision"

          # 3d. Extract the entitlements that the profile authorizes.
          security cms -D -i "$PROFILE" > "$WORK/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$WORK/profile.plist" > "$WORK/entitlements.plist"
          echo "--- entitlements ---"; cat "$WORK/entitlements.plist"

          # 3e. Drop the stale ad-hoc signature, then sign any nested code, then the app.
          rm -rf "$APP/_CodeSignature"
          find "$APP" \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print0 \
            | while IFS= read -r -d '' nested; do
                codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$nested"
              done
          codesign --force --timestamp \
            --entitlements "$WORK/entitlements.plist" \
            --sign "$SIGNING_IDENTITY" "$APP"

          # 3f. Verify the signature is valid before we waste an upload round-trip.
          codesign --verify --deep --strict --verbose=2 "$APP"

          # 3g. GUARD (guideline 2.1 — PassKit), on the SIGNED artifact this
          #     time: the app must neither link PassKit nor carry payment
          #     entitlements in its final signature. otool -L lists every
          #     LC_LOAD_DYLIB / LC_LOAD_WEAK_DYLIB, which is exactly what
          #     Apple's static analysis reads.
          EXECUTABLE="$APP/$($PB -c 'Print :CFBundleExecutable' "$INFO")"
          if otool -L "$EXECUTABLE" | grep -qi 'PassKit'; then
            echo "::error title=PassKit linked::$EXECUTABLE links PassKit.framework — guideline 2.1 rejection guaranteed. The committed mobile.ipa is wrong; rebuild from the wedding repo."
            exit 1
          fi
          codesign -d --entitlements - --xml "$APP" > "$WORK/signed-entitlements.plist" 2>/dev/null
          if grep -Eq 'in-app-payments|pass-type-identifiers' "$WORK/signed-entitlements.plist"; then
            echo "::error title=Payment entitlements in signature::The signed app carries Apple Pay/Wallet entitlements (from the profile) — guideline 2.1 rejection guaranteed."
            exit 1
          fi
          echo "OK: signed app has no PassKit linkage and no payment entitlements."

          # 3h. Repackage (-y preserves any symlinks inside frameworks).
          ( cd "$WORK" && zip -qry "$GITHUB_WORKSPACE/${SIGNED_IPA#./}" Payload )
          echo "Re-signed IPA written to $SIGNED_IPA"

      # 4. Write the App Store Connect API key into the location Apple's tools expect.
      - name: Setup Apple API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      # 5. Validate and upload the freshly re-signed binary.
      - name: Validate and Upload to App Store Connect
        run: |
          echo "Validating App Asset..."
          xcrun altool --validate-app \
            -f "$SIGNED_IPA" \
            -t ios \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

          echo "Uploading App Binary..."
          xcrun altool --upload-app \
            -f "$SIGNED_IPA" \
            -t ios \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"
